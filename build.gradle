plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.16.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'filesystem'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }

    testCompileOnly {
        extendsFrom testAnnotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"

    implementation 'org.springdoc:springdoc-openapi-ui:1.8.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
}

tasks.named('test') {
    useJUnitPlatform()
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$projectDir/src/main/resources/openapi.yaml"
    outputDir = "$buildDir/generated"
    apiPackage = "com.example.filesystem.api.controller"
    modelPackage = "com.example.filesystem.api.model"
    invokerPackage = "com.example.filesystem.api"
    configOptions = [
            library                       : "spring-boot",
            dateLibrary                   : "java8",
            useSpringBoot3                : "true",
            interfaceOnly                 : "true",
            useBeanValidation             : "true",
            useTags                       : "true",
            generateImmutableModels      : "false",
            generateConstructorWithAllArgs: "true"
    ]
}

tasks.named('compileJava') {
    dependsOn 'openApiGenerate'
}

sourceSets {
    main {
        java {
            srcDirs += file("$buildDir/generated/src/main/java")
        }
    }
}